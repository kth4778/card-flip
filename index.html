<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>카드 뒤집기</title>
<meta name="description" content="1초 동안 본 그림, 기억할 수 있나요? 5라운드 카드 짝 맞추기">
<meta property="og:title" content="카드 뒤집기">
<meta property="og:description" content="1초 동안 본 그림, 기억할 수 있나요? 5라운드 카드 짝 맞추기">
<meta property="og:image" content="https://kth4778.github.io/card-flip/og.jpg">
<meta property="og:type" content="website">
<meta name="theme-color" content="#f4efe6">
<style>
  :root {
    --bg: #f4efe6;
    --ink: #1d1b2f;
    --muted: #7a7486;
    --accent: #ff5a3c;
    --ok: #2bb673;
    --back: #2a2550;
    --back-2: #3b3470;
    --card-front: #fffdf8;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Pretendard", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    overflow: hidden;
    user-select: none;
  }
  .screen { position: fixed; inset: 0; display: none; flex-direction: column; align-items: center; padding: 24px 16px calc(24px + env(safe-area-inset-bottom)); }
  .screen.on { display: flex; }

  /* 첫 화면 */
  #start { justify-content: space-between; }
  .title { margin: 4vh 0 0; font-size: clamp(36px, 9vw, 64px); font-weight: 900; letter-spacing: -0.04em; }
  .subtitle { margin: 6px 0 0; color: var(--muted); font-size: 15px; text-align: center; }
  .banner {
    width: min(100%, 560px, calc((100vh - 300px) * 1.5)); aspect-ratio: 3 / 2; border-radius: 28px;
    background: linear-gradient(135deg, var(--back), #6a4cff);
    display: grid; place-items: center; font-size: clamp(64px, 18vw, 120px);
    box-shadow: 0 24px 48px -20px rgba(42, 37, 80, .55);
    overflow: hidden;
  }
  .banner img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .btn {
    border: 0; border-radius: 999px; padding: 18px 56px; font: inherit; font-size: 20px; font-weight: 800;
    color: #fff; background: var(--accent); cursor: pointer;
    box-shadow: 0 6px 0 #c63d24, 0 14px 24px -8px rgba(255, 90, 60, .6);
    transition: transform .08s, box-shadow .08s;
  }
  .btn:active { transform: translateY(5px); box-shadow: 0 1px 0 #c63d24, 0 6px 12px -6px rgba(255, 90, 60, .6); }

  /* 게임 화면 */
  .hud { width: min(100%, 560px); display: flex; justify-content: space-between; align-items: baseline; font-weight: 800; }
  .hud .round { font-size: 15px; color: var(--muted); }
  .hud .time { font-size: 28px; font-variant-numeric: tabular-nums; }
  .hud .time.low { color: var(--accent); }
  .bar { width: min(100%, 560px); height: 8px; border-radius: 8px; background: rgba(29, 27, 47, .1); margin: 10px 0 0; overflow: hidden; }
  .bar i { display: block; height: 100%; width: 100%; background: var(--ink); transform-origin: left; }
  .board-wrap { flex: 1; width: 100%; display: grid; place-items: center; }
  .board { display: grid; gap: 10px; }

  .card { aspect-ratio: 3 / 4; perspective: 800px; cursor: pointer; }
  .card .inner { position: relative; width: 100%; height: 100%; transition: transform .35s cubic-bezier(.2, .8, .2, 1); transform-style: preserve-3d; }
  .card.up .inner { transform: rotateY(180deg); }
  .face { position: absolute; inset: 0; border-radius: 14px; backface-visibility: hidden; -webkit-backface-visibility: hidden; display: grid; place-items: center; overflow: hidden; }
  .face.back {
    background:
      radial-gradient(circle at 50% 50%, rgba(255, 255, 255, .18) 0 18%, transparent 19%),
      repeating-linear-gradient(45deg, var(--back) 0 10px, var(--back-2) 10px 20px);
    box-shadow: inset 0 0 0 3px rgba(255, 255, 255, .12), 0 6px 14px -6px rgba(42, 37, 80, .6);
  }
  .face.back img { width: 100%; height: 100%; object-fit: cover; }
  .face.front img { width: 88%; height: 88%; object-fit: contain; }
  .face.front { background: var(--card-front); transform: rotateY(180deg); box-shadow: 0 6px 14px -6px rgba(29, 27, 47, .35); font-size: var(--emoji, 40px); }
  .card.matched .face.front { box-shadow: 0 0 0 3px var(--ok), 0 8px 18px -6px rgba(43, 182, 115, .6); }
  .card.matched { animation: pop .35s; }
  @keyframes pop { 50% { transform: scale(1.08); } }

  /* 가운데 큰 글씨(카운트다운·라운드 안내) */
  #overlay { position: fixed; inset: 0; display: none; place-items: center; background: rgba(244, 239, 230, .82); backdrop-filter: blur(4px); z-index: 10; text-align: center; }
  #overlay.on { display: grid; }
  #overlay .big { font-size: clamp(72px, 22vw, 160px); font-weight: 900; letter-spacing: -0.04em; animation: zoom .9s ease-out; }
  #overlay .small { font-size: 18px; color: var(--muted); font-weight: 700; }
  @keyframes zoom { from { transform: scale(1.6); opacity: 0; } 30% { transform: scale(1); opacity: 1; } }

  /* 결과 화면 */
  #result { justify-content: center; gap: 18px; text-align: center; }
  #result .emoji { font-size: 88px; }
  #result h2 { margin: 0; font-size: 36px; font-weight: 900; }
  #result p { margin: 0 0 12px; color: var(--muted); font-size: 17px; line-height: 1.5; }
</style>
</head>
<body>

<section id="start" class="screen on">
  <div style="text-align:center">
    <h1 class="title">카드 뒤집기</h1>
    <p class="subtitle">1초 동안 본 그림, 기억할 수 있나요? · 5라운드</p>
  </div>
  <div class="banner" id="banner">🃏</div>
  <button class="btn" id="startBtn">도전하기</button>
</section>

<section id="game" class="screen">
  <div class="hud">
    <span class="round" id="roundLabel"></span>
    <span class="time" id="timeLabel"></span>
  </div>
  <div class="bar"><i id="timeBar"></i></div>
  <div class="board-wrap" id="boardWrap"><div class="board" id="board"></div></div>
</section>

<section id="result" class="screen">
  <div class="emoji" id="resultEmoji"></div>
  <h2 id="resultTitle"></h2>
  <p id="resultText"></p>
  <button class="btn" id="retryBtn">다시 도전하기</button>
</section>

<div id="overlay"><div><div class="big" id="overlayBig"></div><div class="small" id="overlaySmall"></div></div></div>

const PREVIEW_MS = 1000;  // 뒷면을 보여주는 시간, 그리고 앞면을 보여주는 시간
const MISMATCH_MS = 700;  // 틀린 두 장을 보여주고 다시 덮기까지

const $ = id => document.getElementById(id);
const sleep = ms => new Promise(r => setTimeout(r, ms));

let roundIndex = 0;
let totalUsed = 0;        // 모든 라운드에서 실제로 쓴 시간 합계(초)
let picked = [];
let matchedPairs = 0;
let locked = true;
let deadline = 0;
let timerId = 0;
let roundStart = 0;

function show(screenId) {
  document.querySelectorAll(".screen").forEach(s => s.classList.toggle("on", s.id === screenId));
}

async function overlay(big, small = "", ms = 1000) {
  $("overlayBig").textContent = big;
  $("overlaySmall").textContent = small;
  // 같은 글자가 연달아 와도 애니메이션이 다시 돌도록 노드를 새로 붙인다
  const el = $("overlayBig"); el.replaceWith(el.cloneNode(true));
  $("overlay").classList.add("on");
  await sleep(ms);
  $("overlay").classList.remove("on");
}

function faceHtml(face) {
  return face.img ? `<img src="${face.img}" alt="">` : face.emoji;
}

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

// 화면이 세로로 길면 칸 수가 적은 쪽을 가로로 둔다
function layout() {
  const { cols, rows } = ROUNDS[roundIndex];
  const portrait = innerHeight > innerWidth;
  const c = portrait ? Math.min(cols, rows) : Math.max(cols, rows);
  const r = cols * rows / c;
  const wrap = $("boardWrap").getBoundingClientRect();
  const gap = 10;
  const byWidth = (wrap.width - gap * (c - 1)) / c;
  const byHeight = ((wrap.height - gap * (r - 1)) / r) * 3 / 4;
  const size = Math.min(byWidth, byHeight, 140);
  const board = $("board");
  board.style.gridTemplateColumns = `repeat(${c}, ${size}px)`;
  board.style.setProperty("--emoji", `${size * 0.5}px`);
}

function buildBoard() {
  const { cols, rows } = ROUNDS[roundIndex];
  const pairs = cols * rows / 2;
  const faces = shuffle(FACES.slice()).slice(0, pairs);
  const deck = shuffle([...faces, ...faces].map((face, i) => ({ face, key: FACES.indexOf(face) })));
  const board = $("board");
  board.innerHTML = "";
  deck.forEach(({ face, key }) => {
    const card = document.createElement("div");
    card.className = "card";
    card.dataset.key = key;
    card.innerHTML = `<div class="inner">
      <div class="face back">${CARD_BACK ? `<img src="${CARD_BACK}" alt="">` : ""}</div>
      <div class="face front">${faceHtml(face)}</div></div>`;
    card.addEventListener("click", () => pick(card));
    board.appendChild(card);
  });
  layout();
}

function setAll(up) {
  document.querySelectorAll(".card").forEach(c => c.classList.toggle("up", up));
}

async function playRound() {
  const { cols, rows, limit } = ROUNDS[roundIndex];
  locked = true;
  picked = [];
  matchedPairs = 0;
  show("game");
  $("roundLabel").textContent = `ROUND ${roundIndex + 1} / ${ROUNDS.length} · ${cols} × ${rows}`;
  renderTime(limit, limit);
  buildBoard();
  await overlay(`${cols} × ${rows}`, `ROUND ${roundIndex + 1}`, 900);

  // 뒷면 1초 → 앞면 1초 → 다시 뒷면, 그 뒤 시간 시작
  await sleep(PREVIEW_MS);
  setAll(true);
  await sleep(PREVIEW_MS);
  setAll(false);
  await sleep(350);

  roundStart = performance.now();
  deadline = roundStart + limit * 1000;
  locked = false;
  tick();
}

function renderTime(left, limit) {
  $("timeLabel").textContent = left.toFixed(1);
  $("timeLabel").classList.toggle("low", left <= 3);
  $("timeBar").style.transform = `scaleX(${left / limit})`;
}

function tick() {
  const { limit } = ROUNDS[roundIndex];
  const left = Math.max(0, (deadline - performance.now()) / 1000);
  renderTime(left, limit);
  if (left <= 0) return fail();
  timerId = requestAnimationFrame(tick);
}

async function pick(card) {
  if (locked || card.classList.contains("up")) return;
  card.classList.add("up");
  picked.push(card);
  if (picked.length < 2) return;

  const [a, b] = picked;
  picked = [];
  if (a.dataset.key === b.dataset.key) {
    a.classList.add("matched");
    b.classList.add("matched");
    matchedPairs++;
    const { cols, rows } = ROUNDS[roundIndex];
    if (matchedPairs === cols * rows / 2) clearRound();
  } else {
    locked = true;
    await sleep(MISMATCH_MS);
    a.classList.remove("up");
    b.classList.remove("up");
    if (performance.now() < deadline) locked = false;
  }
}

async function clearRound() {
  locked = true;
  cancelAnimationFrame(timerId);
  totalUsed += (performance.now() - roundStart) / 1000;
  await sleep(400);
  roundIndex++;
  if (roundIndex === ROUNDS.length) return finish(true);
  await overlay("성공!", "다음 라운드", 900);
  playRound();
}

function fail() {
  locked = true;
  cancelAnimationFrame(timerId);
  finish(false);
}

function finish(cleared) {
  show("result");
  if (cleared) {
    $("resultEmoji").textContent = "🏆";
    $("resultTitle").textContent = "전 라운드 클리어!";
    $("resultText").innerHTML = `5라운드를 모두 깼어요.<br>총 걸린 시간 <b>${totalUsed.toFixed(2)}초</b>`;
  } else {
    $("resultEmoji").textContent = "⏰";
    $("resultTitle").textContent = "시간 초과";
    $("resultText").innerHTML = `ROUND ${roundIndex + 1}에서 멈췄어요.<br>1라운드부터 다시 도전!`;
  }
}

async function startChallenge() {
  roundIndex = 0;
  totalUsed = 0;
  show("game");
  $("board").innerHTML = "";
  for (const n of ["3", "2", "1"]) await overlay(n, "", 1000);
  playRound();
}

if (BANNER) $("banner").innerHTML = `<img src="${BANNER}" alt="">`;
$("startBtn").addEventListener("click", startChallenge);
$("retryBtn").addEventListener("click", startChallenge);
addEventListener("resize", () => { if ($("game").classList.contains("on")) layout(); });
</script>
</body>
</html>
