<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>카드 뒤집기</title>
<meta name="description" content="1초 동안 본 그림, 기억할 수 있나요? 5라운드 카드 짝 맞추기">
<meta property="og:title" content="카드 뒤집기">
<meta property="og:description" content="1초 동안 본 그림, 기억할 수 있나요? 5라운드 카드 짝 맞추기">
<meta property="og:image" content="https://kth4778.github.io/card-flip/og.jpg">
<meta property="og:type" content="website">
<meta name="theme-color" content="#f4efe6">
<link rel="icon" id="favicon">
<style>
  :root {
    --bg: #f4efe6;
    --panel: #fffdf8;
    --ink: #1d1b2f;
    --muted: #7a7486;
    --line: rgba(29, 27, 47, .08);
    --accent: #ff5a3c;
    --accent-dark: #c63d24;
    --gold: #c9a24a;
    --ok: #2bb673;
    --indigo: #2a2550;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Pretendard", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
  }
  /* 누른 채로 움직여도 그림이 끌려가지 않게 */
  img { -webkit-user-drag: none; user-drag: none; pointer-events: none; }
  button { font: inherit; }

  .screen { position: fixed; inset: 0; display: none; }
  .screen.on { display: flex; }

  /* ───────── 메인 화면 ───────── */
  #start {
    flex-direction: column; overflow-y: auto; overflow-x: hidden;
    background:
      radial-gradient(600px 420px at 12% 8%, rgba(255, 90, 60, .10), transparent 70%),
      radial-gradient(700px 520px at 92% 70%, rgba(106, 76, 255, .10), transparent 70%),
      var(--bg);
  }
  #start::before {
    content: ""; position: fixed; inset: 0; pointer-events: none;
    background-image: radial-gradient(rgba(29, 27, 47, .05) 1px, transparent 1.2px);
    background-size: 22px 22px;
  }
  .home { position: relative; }
  .home {
    width: 100%; max-width: 1180px; margin: 0 auto; flex: 1;
    display: grid; grid-template-columns: 1fr; gap: 8px;
    padding: 20px 16px calc(128px + env(safe-area-inset-bottom));
  }
  .hero { display: flex; flex-direction: column; align-items: center; text-align: center; }
  .eyebrow {
    display: inline-flex; gap: 8px; align-items: center;
    font-size: 12px; font-weight: 800; letter-spacing: .18em; color: var(--muted);
  }
  .eyebrow i { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand img { width: 44px; height: 44px; border-radius: 12px; object-fit: cover; }
  .stage { position: relative; display: flex; justify-content: center; width: 100%; }
  .stage::before {
    content: ""; position: absolute; left: 50%; top: 52%; width: 70%; aspect-ratio: 1; translate: -50% -50%;
    border-radius: 50%; background: radial-gradient(circle, rgba(255, 215, 122, .4), rgba(255, 90, 60, .08) 45%, transparent 70%);
    z-index: 0;
  }
  .stage .banner { position: relative; z-index: 1; }
  .sparkle { position: absolute; z-index: 2; color: var(--gold); font-size: 18px; animation: twinkle 2.8s ease-in-out infinite; }
  .sparkle.s1 { left: 14%; top: 18%; }
  .sparkle.s2 { right: 12%; top: 60%; font-size: 13px; animation-delay: .9s; }
  .sparkle.s3 { left: 46%; top: 6%; font-size: 11px; animation-delay: 1.7s; color: var(--accent); }
  @keyframes twinkle { 0%, 100% { opacity: .15; transform: scale(.7) rotate(0); } 50% { opacity: 1; transform: scale(1.1) rotate(20deg); } }
  .title { margin: 10px 0 0; font-size: clamp(44px, 12vw, 88px); line-height: .95; font-weight: 900; letter-spacing: -0.05em; }
  .title em { font-style: normal; color: var(--accent); }
  .tagline { margin: 12px 0 0; color: var(--muted); font-size: 15px; line-height: 1.5; }
  .banner {
    width: min(118%, 760px); margin: -6px -9% -10px; aspect-ratio: 3 / 2;
    /* 가장자리 녹임은 embed.py가 그림에 투명도로 미리 넣어 둔다. CSS 마스크는 폰에서 매 프레임 다시 그려 끊긴다 */
    animation: float 6s ease-in-out infinite;
    will-change: transform;
  }
  .banner img { width: 100%; height: 100%; object-fit: cover; display: block; }
  @keyframes float { 50% { transform: translate3d(0, -8px, 0); } }


  /* 랭킹 */
  .rank { background: var(--panel); border: 1px solid var(--line); border-radius: 24px; padding: 20px; box-shadow: 0 20px 40px -28px rgba(29, 27, 47, .35); align-self: start; display: flex; flex-direction: column; }
  .rank-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 12px; }
  .rank-head h2 { margin: 0; font-size: 20px; font-weight: 900; letter-spacing: -0.02em; }
  .rank-head span { font-size: 12px; color: var(--muted); font-weight: 700; }
  .rank ol { list-style: none; margin: 0; padding: 0; display: grid; grid-auto-rows: minmax(44px, 1fr); flex: 1; }
  .rank li {
    display: grid; grid-template-columns: 36px 1fr auto; align-items: center; gap: 8px;
    padding: 11px 12px; border-radius: 14px; font-weight: 700; font-size: 15px;
  }
  .rank li + li { border-top: 1px solid var(--line); }
  .rank li.me + li, .rank li + li.me { border-top-color: transparent; }
  .rank .pos { font-weight: 900; color: var(--muted); font-variant-numeric: tabular-nums; }
  .rank li:nth-child(1):not(.blank) .pos { color: var(--gold); }
  .rank .name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .rank .t { font-variant-numeric: tabular-nums; font-weight: 800; }
  .rank li.me { background: var(--indigo); color: #fff; }
  .rank li.me .pos { color: #ffd77a; }
  .rank li.me .name::after { content: "나"; margin-left: 6px; padding: 2px 7px; border-radius: 999px; background: var(--accent); font-size: 11px; vertical-align: 2px; }
  .rank li.gap { display: block; text-align: center; color: var(--muted); padding: 2px 0; letter-spacing: .3em; }
  .rank li.blank .name, .rank li.blank .t { color: rgba(29, 27, 47, .18); }
  .rank li.blank .pos { color: rgba(29, 27, 47, .25); }
  .me-line { margin-top: 12px; padding-top: 12px; border-top: 1px dashed var(--line); font-size: 13px; color: var(--muted); display: flex; justify-content: space-between; gap: 8px; }
  .me-line b { color: var(--ink); }

  .cta {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; width: 100%;
    padding: 16px 16px calc(16px + env(safe-area-inset-bottom));
    background: linear-gradient(to top, var(--bg) 60%, transparent);
    display: flex; justify-content: center;
  }
  .btn {
    border: 0; border-radius: 999px; padding: 25px 0; width: 100%; max-width: 440px; font-size: 22px; font-weight: 900;
    color: #fff; background: var(--accent); cursor: pointer; letter-spacing: -0.01em;
    box-shadow: 0 6px 0 var(--accent-dark), 0 16px 28px -10px rgba(255, 90, 60, .7);
    transition: transform .08s, box-shadow .08s;
    touch-action: manipulation;
  }
  .btn:active { transform: translateY(5px); box-shadow: 0 1px 0 var(--accent-dark), 0 6px 12px -6px rgba(255, 90, 60, .6); }
  .btn.ghost { background: var(--panel); color: var(--ink); box-shadow: 0 6px 0 #d9d2c4, 0 16px 28px -14px rgba(29, 27, 47, .3); }
  .btn.ghost:active { box-shadow: 0 1px 0 #d9d2c4; }

  /* PC: 왼쪽 소개 · 오른쪽 랭킹 */
  @media (min-width: 900px) and (min-height: 560px) {
    .home { grid-template-columns: 1.25fr .85fr; align-items: center; gap: 40px; padding: 32px 40px; }
    .hero { align-items: flex-start; text-align: left; }
    .title { font-size: clamp(56px, 8vh, 88px); }
    /* 화면 높이에 맞춰 배너를 줄여야 버튼이 아래로 잘리지 않는다 */
    .banner { width: min(112%, calc((100vh - 400px) * 1.5)); margin: -10px 0 -18px -4%; }
    .cta { position: static; width: 100%; background: none; padding: 28px 0 0; justify-content: flex-start; }
    .home { align-items: stretch; }
    .hero { justify-content: center; }
    .rank { align-self: stretch; margin: 24px 0; }
  }

  /* ───────── 게임 화면 ───────── */
  #game { flex-direction: column; align-items: center; padding: 20px 16px calc(20px + env(safe-area-inset-bottom)); }
  .hud { width: min(100%, 640px); display: flex; justify-content: space-between; align-items: flex-end; }
  .hud small { display: block; font-size: 12px; font-weight: 800; color: var(--muted); letter-spacing: .12em; }
  .hud .round b { font-size: 22px; font-weight: 900; }
  .hud .total { text-align: center; }
  .hud .total b { font-size: 16px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .hud .time { text-align: right; }
  .hud .time b { font-size: 30px; font-weight: 900; font-variant-numeric: tabular-nums; }
  .hud .time.low b { color: var(--accent); }
  .bar { width: min(100%, 640px); height: 8px; border-radius: 8px; background: rgba(29, 27, 47, .1); margin: 10px 0 0; overflow: hidden; }
  .bar i { display: block; height: 100%; width: 100%; background: var(--ink); transform-origin: left; }
  .bar.low i { background: var(--accent); }
  .board-wrap { flex: 1; width: 100%; display: grid; place-items: center; }
  .board { display: grid; gap: 10px; touch-action: manipulation; }

  .card { aspect-ratio: 3 / 4; perspective: 900px; cursor: pointer; --d: 0ms; }
  .card .inner {
    position: relative; width: 100%; height: 100%; transform-style: preserve-3d;
    transform: rotateY(0deg); will-change: transform;
    transition: transform .42s cubic-bezier(.3, .7, .25, 1) var(--d);
  }
  .card.up .inner { transform: rotateY(180deg); }
  /* 누르는 순간 살짝 눌리는 손맛 */
  .card:active .inner { scale: .96; }
  /* 판이 깔릴 때 한 장씩 떨어지듯 나타난다 */
  .card.deal { animation: deal .38s cubic-bezier(.2, .9, .3, 1.15) var(--d) both; }
  @keyframes deal { from { opacity: 0; transform: translateY(18px) scale(.86); } }
  .face { position: absolute; inset: 0; border-radius: 14px; backface-visibility: hidden; -webkit-backface-visibility: hidden; transform: translateZ(0); display: grid; place-items: center; overflow: hidden; }
  .face.back { background: var(--indigo); box-shadow: 0 4px 10px -5px rgba(42, 37, 80, .55); }
  .face.back img { width: 100%; height: 100%; object-fit: cover; }
  .face.front { background: var(--panel); transform: rotateY(180deg) translateZ(0); box-shadow: 0 4px 10px -5px rgba(29, 27, 47, .3); }
  .face.front img { width: 88%; height: 88%; object-fit: contain; }
  .card.matched .face.front { box-shadow: 0 0 0 3px var(--ok), 0 8px 18px -6px rgba(43, 182, 115, .6); }
  .card.matched { animation: pop .35s; }
  .card.miss .inner { animation: shake .3s; }
  @keyframes pop { 50% { transform: scale(1.08); } }
  @keyframes shake { 25% { translate: -4px 0; } 75% { translate: 4px 0; } }

  /* ───────── 가운데 큰 글씨 ───────── */
  #overlay { position: fixed; inset: 0; display: none; place-items: center; background: rgba(244, 239, 230, .94); z-index: 10; text-align: center; }
  #overlay.on { display: grid; animation: fade .18s ease-out; }
  @keyframes fade { from { opacity: 0; } }
  #overlay.dark { background: rgba(29, 27, 47, .92); color: #fff; }
  #overlay .kicker { font-size: 14px; font-weight: 800; letter-spacing: .2em; color: var(--muted); }
  #overlay.dark .kicker { color: #ffd77a; }
  #overlay.dark .big { color: #fff; font-size: clamp(64px, 19vw, 160px); text-shadow: 0 0 40px rgba(255, 215, 122, .35); }
  #overlay .big { font-size: clamp(72px, 22vw, 168px); font-weight: 900; letter-spacing: -0.05em; line-height: 1; font-variant-numeric: tabular-nums; animation: zoom .6s cubic-bezier(.2, .9, .3, 1.3); }
  #overlay .small { margin-top: 14px; font-size: 18px; font-weight: 700; }
  #overlay .small b { font-size: 26px; font-weight: 900; font-variant-numeric: tabular-nums; }
  .total-big { margin: 10px 0 18px; font-size: clamp(80px, 26vw, 200px); font-weight: 900; letter-spacing: -0.05em; line-height: 1; color: #fff; font-variant-numeric: tabular-nums; }
  .total-big.hit { animation: hit .5s cubic-bezier(.2, .9, .3, 1); }
  @keyframes hit { 0% { transform: scale(1); } 20% { transform: scale(1.22); color: #ffd77a; text-shadow: 0 0 60px rgba(255, 215, 122, .8); } 100% { transform: scale(1); } }
  /* 화면 전체가 울리는 효과 */
  body.quake { animation: quake .45s cubic-bezier(.36, .07, .19, .97); }
  @keyframes quake {
    10%, 90% { transform: translate(-2px, 1px); }
    20%, 80% { transform: translate(5px, -3px); }
    30%, 50%, 70% { transform: translate(-9px, 4px); }
    40%, 60% { transform: translate(9px, -4px); }
  }
  @keyframes zoom { from { transform: scale(1.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }

  /* ───────── 결과 화면 ───────── */
  #result { flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 24px 16px; text-align: center; }
  #result .emoji { font-size: 76px; }
  #result h2 { margin: 0; font-size: 34px; font-weight: 900; letter-spacing: -0.03em; }
  #result .score { font-size: clamp(56px, 16vw, 96px); font-weight: 900; letter-spacing: -0.05em; font-variant-numeric: tabular-nums; line-height: 1; }
  #result p { margin: 0 0 8px; color: var(--muted); font-size: 16px; line-height: 1.6; }
  #result p b { color: var(--ink); }
  #result .actions { display: grid; justify-items: center; gap: 14px; width: min(100%, 440px); margin-top: 8px; }
</style>
</head>
<body>

<section id="start" class="screen on">
  <div class="home">
    <div class="hero">
      <div class="brand"><img id="logo" alt="" draggable="false"><span class="eyebrow"><i></i>MEMORY GAME · 5 ROUNDS</span></div>
      <h1 class="title">카드<br><em>뒤집기</em></h1>
      <p class="tagline">잠깐 보여준 그림, 기억할 수 있나요?<br>가장 빨리 5라운드를 깨면 1등.</p>
      <div class="stage"><span class="sparkle s1">✦</span><span class="sparkle s2">✦</span><span class="sparkle s3">✦</span><div class="banner" id="banner"></div></div>
      <div class="cta"><button class="btn" id="startBtn">도전하기</button></div>
    </div>
    <aside class="rank">
      <div class="rank-head"><h2>🏆 명예의 전당</h2><span>5라운드 총 시간</span></div>
      <ol id="rankList"></ol>
      <div class="me-line"><span>내 이름 <b id="myName"></b></span><span id="myBest"></span></div>
    </aside>
  </div>
</section>

<section id="game" class="screen">
  <div class="hud">
    <div class="round"><small>ROUND</small><b id="roundLabel"></b></div>
    <div class="total"><small>TOTAL</small><b id="totalLabel">0.00</b></div>
    <div class="time" id="timeBox"><small>LEFT</small><b id="timeLabel"></b></div>
  </div>
  <div class="bar" id="bar"><i id="timeBar"></i></div>
  <div class="board-wrap" id="boardWrap"><div class="board" id="board"></div></div>
</section>

<section id="result" class="screen">
  <div class="emoji" id="resultEmoji"></div>
  <h2 id="resultTitle"></h2>
  <div class="score" id="resultScore"></div>
  <p id="resultText"></p>
  <div class="actions">
    <button class="btn" id="retryBtn">다시 도전하기</button>
    <button class="btn ghost" id="homeBtn">랭킹 보기</button>
  </div>
</section>

<div id="overlay"><div id="overlayBody"></div></div>

  { cols: 3, rows: 2, limit: 15 },
  { cols: 4, rows: 3, limit: 20 },

  { cols: 5, rows: 4, limit: 30 },

// 플레이어마다 가장 좋은 기록 하나만 남겨 빠른 순으로 줄 세운다
function bestPerPlayer(records) {
  const best = new Map();
  for (const r of records) {
    if (!best.has(r.id) || r.time < best.get(r.id).time) best.set(r.id, r);
  }
  return [...best.values()].sort((a, b) => a.time - b.time);
}

const TOP_N = 10;
async function renderRank() {
  let records = [];
  try { records = await RankStore.list(); } catch (e) { console.error(e); }
  const ranked = bestPerPlayer(records);
  const myIndex = ranked.findIndex(r => r.id === me.id);
  const row = (r, i) => `<li class="${r.id === me.id ? "me" : ""}"><span class="pos">${i + 1}</span><span class="name">${escapeHtml(r.name)}</span><span class="t">${r.time.toFixed(2)}초</span></li>`;
  let html = ranked.slice(0, TOP_N).map(row).join("");
  // 기록이 모자란 칸은 빈 줄로 채워 판 크기를 일정하게 둔다
  for (let i = Math.min(ranked.length, TOP_N); i < TOP_N; i++) html += `<li class="blank"><span class="pos">${i + 1}</span><span class="name">—</span><span class="t">--.--</span></li>`;
  // 내가 10위 밖이면 맨 아래에 내 줄을 따로 붙인다
  if (myIndex >= TOP_N) html += `<li class="gap">···</li>` + row(ranked[myIndex], myIndex);
  $("rankList").innerHTML = html;
  $("myName").textContent = me.name;
  $("myBest").innerHTML = myIndex >= 0 ? `최고 <b>${ranked[myIndex].time.toFixed(2)}초</b> · <b>${myIndex + 1}위</b>` : "아직 기록 없음";
  return { ranked, myIndex };
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

// 라운드 사이: 이전 총합이 뜬 상태에서 화면이 쾅 흔들리고, 숫자가 새 총합까지 굴러 올라간다
async function showRoundSum(kicker, prev, used, total, footer) {
  showOverlay(`<div class="kicker">${kicker}</div>
    <div class="total-big" id="sumTotal">${prev.toFixed(2)}</div>
    <div class="small">${footer}</div>`, true);
  await sleep(450);
  const el = $("sumTotal");
  document.body.classList.remove("quake");
  void document.body.offsetWidth; // 같은 애니메이션을 다시 돌리기 위해 한 번 그려지게 한다
  document.body.classList.add("quake");
  el.classList.add("hit");
  const t0 = performance.now();
  await new Promise(done => {
    const step = now => {
      const k = Math.min(1, (now - t0) / 700);
      el.textContent = (prev + (total - prev) * (1 - (1 - k) ** 3)).toFixed(2);
      if (k < 1) requestAnimationFrame(step); else done();
    };
    requestAnimationFrame(step);
    setTimeout(done, 750); // 프레임이 밀려도 제때 끝나게
  });
  el.textContent = total.toFixed(2);
  await sleep(1000);
  document.body.classList.remove("quake");
  $("overlay").classList.remove("on");
}

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

// 화면이 세로로 길면 칸 수가 적은 쪽을 가로로 둔다
function layout() {
  const { cols, rows } = ROUNDS[roundIndex];
  const portrait = innerHeight > innerWidth;
  const c = portrait ? Math.min(cols, rows) : Math.max(cols, rows);
  const r = cols * rows / c;
  const wrap = $("boardWrap").getBoundingClientRect();
  const gap = 10;
  const byWidth = (wrap.width - gap * (c - 1)) / c;
  const byHeight = ((wrap.height - gap * (r - 1)) / r) * 3 / 4;
  const size = Math.floor(Math.min(byWidth, byHeight, 150));
  $("board").style.gridTemplateColumns = `repeat(${c}, ${size}px)`;
}

const WAVE_STEP_MS = 28; // 이웃 카드끼리 뒤집히는 시간 차
const FLIP_MS = 420;     // CSS 회전 시간과 같게

// 왼쪽 위에서 오른쪽 아래로 물결이 지나가듯 카드마다 출발 시간을 준다. 가장 늦은 카드의 지연을 돌려준다
function setWave() {
  const cards = [...document.querySelectorAll(".card")];
  const cols = getComputedStyle($("board")).gridTemplateColumns.split(" ").length;
  let max = 0;
  cards.forEach((c, i) => {
    const d = (Math.floor(i / cols) + i % cols) * WAVE_STEP_MS;
    c.style.setProperty("--d", `${d}ms`);
    max = Math.max(max, d);
  });
  return max;
}

function clearWave() {
  document.querySelectorAll(".card").forEach(c => c.style.removeProperty("--d"));
}

async function buildBoard() {
  const { cols, rows } = ROUNDS[roundIndex];
  const keys = shuffle(FACES.map((_, i) => i)).slice(0, cols * rows / 2);
  const deck = shuffle([...keys, ...keys]);
  $("board").innerHTML = deck.map(key => `<div class="card" data-key="${key}"><div class="inner">
      <div class="face back"><img src="${CARD_BACK}" alt="" draggable="false"></div>
      <div class="face front"><img src="${FACES[key]}" alt="" draggable="false"></div></div></div>`).join("");
  layout();
  const lastDelay = setWave();
  document.querySelectorAll(".card").forEach(c => c.classList.add("deal"));
  await Promise.all([...$("board").querySelectorAll("img")].map(img => img.decode().catch(() => {})));
  return lastDelay;
}

function setAll(up) {
  document.querySelectorAll(".card").forEach(c => c.classList.toggle("up", up));
}

async function playRound(run) {
  const { limit } = ROUNDS[roundIndex];
  locked = true;
  picked = [];
  matchedPairs = 0;
  show("game");
  $("roundLabel").textContent = `${roundIndex + 1} / ${ROUNDS.length}`;
  $("totalLabel").textContent = totalUsed.toFixed(2);
  renderTime(limit, limit);
  await imagesReady;
  const wave = await buildBoard();

  // 뒷면 → 앞면(라운드마다 0.2초씩 길게) → 다시 뒷면, 그 뒤부터 시간을 센다.
  // 카드마다 같은 시간 차로 올라가고 내려가므로 모든 카드의 앞면이 같은 시간만큼 보인다
  await sleep(BACK_MS);
  if (run !== runId) return;
  document.querySelectorAll(".card").forEach(c => c.classList.remove("deal"));
  setAll(true);
  await sleep(FLIP_MS + FRONT_MS + FRONT_STEP_MS * roundIndex);
  if (run !== runId) return;
  setAll(false);
  await sleep(wave + FLIP_MS);
  if (run !== runId) return;
  clearWave(); // 직접 고를 때는 바로 뒤집혀야 한다

  deadline = performance.now() + limit * 1000;
  locked = false;
  tick();
}

function renderTime(left, limit) {
  const low = left <= 3;
  $("timeLabel").textContent = left.toFixed(2);
  $("timeBox").classList.toggle("low", low);
  $("bar").classList.toggle("low", low);
  $("timeBar").style.transform = `scaleX(${left / limit})`;
}

function tick() {
  const { limit } = ROUNDS[roundIndex];
  const left = Math.max(0, (deadline - performance.now()) / 1000);
  renderTime(left, limit);
  if (left <= 0) return fail();
  timerId = requestAnimationFrame(tick);
}

// 클릭(손을 뗄 때)이 아니라 누르는 순간 반응해야 빠르게 눌러도 씹히지 않는다
$("board").addEventListener("pointerdown", e => {
  const card = e.target.closest(".card");
  if (card) { e.preventDefault(); pick(card); }
});

async function pick(card) {
  if (locked || card.classList.contains("up")) return;
  card.classList.add("up");
  picked.push(card);
  if (picked.length < 2) return;

  const [a, b] = picked;
  picked = [];
  if (a.dataset.key === b.dataset.key) {
    a.classList.add("matched");
    b.classList.add("matched");
    matchedPairs++;
    const { cols, rows } = ROUNDS[roundIndex];
    if (matchedPairs === cols * rows / 2) clearRound();
  } else {
    locked = true;
    a.classList.add("miss");
    b.classList.add("miss");
    await sleep(MISMATCH_MS);
    a.classList.remove("up", "miss");
    b.classList.remove("up", "miss");
    if (performance.now() < deadline) locked = false;
  }
}

async function clearRound() {
  const run = runId;
  locked = true;
  cancelAnimationFrame(timerId);
  const { limit } = ROUNDS[roundIndex];
  const left = Math.max(0, (deadline - performance.now()) / 1000);
  // 화면에 보이는 소수 둘째 자리 기준으로 더해야 합계가 눈으로 계산한 값과 맞는다
  const used = Math.round((limit - left) * 100) / 100;
  const prev = totalUsed;
  totalUsed = Math.round((totalUsed + used) * 100) / 100;
  $("totalLabel").textContent = totalUsed.toFixed(2);
  await sleep(350);
  if (run !== runId) return;
  roundIndex++;
  if (roundIndex === ROUNDS.length) {
    await showRoundSum(`ROUND ${ROUNDS.length} CLEAR`, prev, used, totalUsed, "최종 기록");
    return finish(true);
  }
  await showRoundSum(`ROUND ${roundIndex} CLEAR`, prev, used, totalUsed, `다음 ROUND ${roundIndex + 1}`);
  if (run !== runId) return;
  playRound(run);
}

function fail() {
  locked = true;
  cancelAnimationFrame(timerId);
  finish(false);
}

async function finish(cleared) {
  show("result");
  if (!cleared) {
    $("resultEmoji").textContent = "⏰";
    $("resultTitle").textContent = "시간 초과";
    $("resultScore").textContent = "";
    $("resultText").innerHTML = `ROUND ${roundIndex + 1}에서 멈췄어요.<br>1라운드부터 다시 도전!`;
    return;
  }
  $("resultEmoji").textContent = "🏆";
  $("resultTitle").textContent = "5라운드 클리어!";
  $("resultScore").textContent = `${totalUsed.toFixed(2)}초`;
  $("resultText").textContent = "기록 저장 중…";
  let before;
  try {
    before = bestPerPlayer(await RankStore.list()).find(r => r.id === me.id);
    await RankStore.add({ id: me.id, name: me.name, time: totalUsed });
  } catch (e) {
    console.error(e);
    $("resultText").textContent = "기록을 저장하지 못했어요. 인터넷 연결을 확인해 주세요.";
    return;
  }
  const { ranked, myIndex } = await renderRank();
  const isBest = !before || totalUsed < before.time;
  $("resultText").innerHTML = `<b>${escapeHtml(me.name)}</b>님은 지금 <b>${myIndex + 1}위</b> / ${ranked.length}명` +
    (isBest ? "<br>🎉 개인 최고 기록!" : `<br>개인 최고는 ${before.time.toFixed(2)}초`);
}

async function startChallenge() {
  const run = ++runId;
  roundIndex = 0;
  totalUsed = 0;
  locked = true;
  cancelAnimationFrame(timerId);
  show("game");
  $("board").innerHTML = "";
  $("roundLabel").textContent = `1 / ${ROUNDS.length}`;
  $("totalLabel").textContent = "0.00";
  renderTime(ROUNDS[0].limit, ROUNDS[0].limit);
  for (const n of ["3", "2", "1"]) {
    await overlay({ big: n, kicker: "READY" }, 1000);
    if (run !== runId) return;
  }
  playRound(run);
}

$("banner").innerHTML = `<img src="${BANNER}" alt="" draggable="false">`;
$("logo").src = LOGO;
$("favicon").href = LOGO;
$("startBtn").addEventListener("click", startChallenge);
$("retryBtn").addEventListener("click", startChallenge);
$("homeBtn").addEventListener("click", () => { renderRank(); show("start"); });
addEventListener("resize", () => { if ($("game").classList.contains("on")) layout(); });
addEventListener("dragstart", e => e.preventDefault());
renderRank();
</script>
</body>
</html>
